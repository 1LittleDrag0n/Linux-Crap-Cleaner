<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Linux Crap Cleaner</title>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fd889"/>
      <stop offset="1" stop-color="#1f9d5c"/>
    </linearGradient>
    <linearGradient id="bristles" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd64f"/>
      <stop offset="1" stop-color="#f0a30a"/>
    </linearGradient>
  </defs>
  <!-- Base: rounded square with a darker lower edge for depth -->
  <rect x="8" y="12" width="112" height="108" rx="26" fill="#17804a"/>
  <rect x="8" y="8" width="112" height="106" rx="26" fill="url(#base)"/>
  <!-- Broom handle -->
  <path d="M95 18 L63 66" stroke="#fdf6e3" stroke-width="9" stroke-linecap="round"/>
  <path d="M95 18 L63 66" stroke="#c88a4b" stroke-width="5" stroke-linecap="round"/>
