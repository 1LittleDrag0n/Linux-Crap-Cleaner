  <!-- Sparkles: clean! -->
  <path d="M94 66 Q96 76 106 78 Q96 80 94 90 Q92 80 82 78 Q92 76 94 66 Z" fill="#ffffff"/>
  <path d="M103 40 Q104 46 110 47 Q104 48 103 54 Q102 48 96 47 Q102 46 103 40 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M32 28 Q33 35 40 36 Q33 37 32 44 Q31 37 24 36 Q31 35 32 28 Z" fill="#ffffff" opacity="0.85"/>
</svg>
