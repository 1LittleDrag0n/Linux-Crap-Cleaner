[workspace]
resolver = "3"
members = ["crates/lcc-core", "crates/lcc-gui", "crates/lcc-helper"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.93"

[workspace.dependencies]
lcc-core = { path = "crates/lcc-core" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
