[package]
name = "lcc-gui"
description = "Linux Crap Cleaner: a friendly system cleaner for Linux"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "linux-crap-cleaner"
path = "src/main.rs"

[dependencies]
lcc-core.workspace = true
# gnome_46 = GTK 4.14 + libadwaita 1.5 or newer (Ubuntu 24.04, Fedora 40, Debian 13, Arch)
relm4 = { version = "0.11", features = ["libadwaita", "gnome_46"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
