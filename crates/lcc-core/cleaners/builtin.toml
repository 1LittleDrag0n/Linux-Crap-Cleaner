# ── Apps ────────────────────────────────────────────────────────────────────

[[cleaner]]
id = "thumbnails"
name = "Thumbnails"
category = "apps"
description = "Small previews of your pictures and videos. They're recreated when needed."
icon = "image-x-generic-symbolic"
default = true
paths = ["{cache}/thumbnails/*"]

[[cleaner]]
id = "spotify-cache"
name = "Spotify"
category = "apps"
description = "Songs and images Spotify saved to play faster."
icon = "audio-x-generic-symbolic"
default = true
running = ["spotify"]
paths = ["{cache}/spotify/*"]

[[cleaner]]
id = "discord-cache"
name = "Discord"
category = "apps"
description = "Cached images and app code. Your login is kept."
icon = "user-available-symbolic"
default = true
running = ["Discord", "discord", "vesktop"]
paths = [
    "{config}/discord/Cache",
    "{config}/discord/Code Cache",
    "{config}/discord/GPUCache",
    "{config}/vesktop/sessionData/Cache",
    "{config}/vesktop/sessionData/Code Cache",
]

[[cleaner]]
id = "vscode-cache"
name = "Visual Studio Code"
category = "apps"
description = "Cached data and old logs. Your settings and extensions are kept."
icon = "text-editor-symbolic"
default = true
running = ["code", "code-oss", "codium"]
paths = [
    "{config}/Code/Cache",
    "{config}/Code/CachedData",
    "{config}/Code/CachedExtensionVSIXs",
    "{config}/Code/Code Cache",
    "{config}/Code/GPUCache",
    "{config}/Code/logs",
    "{config}/Code - OSS/Cache",
    "{config}/Code - OSS/CachedData",
    "{config}/Code - OSS/Code Cache",
    "{config}/Code - OSS/logs",
    "{config}/VSCodium/Cache",
    "{config}/VSCodium/CachedData",
    "{config}/VSCodium/Code Cache",
    "{config}/VSCodium/logs",
]

[[cleaner]]
id = "flatpak-app-caches"
name = "Flatpak app caches"
category = "apps"
description = "Temporary files of apps installed from Flathub."
icon = "package-x-generic-symbolic"
default = true
paths = ["{home}/.var/app/*/cache/*"]

[[cleaner]]
id = "other-app-caches"
name = "Other app caches"
category = "apps"
description = "Everything else in your cache folder. Some apps may start a little slower the next time."
icon = "folder-symbolic"
default = false
exclude_known = true
paths = ["{cache}/*"]

