# Built-in cleaners for the Junk Cleaner.
#
# Each [[cleaner]] describes one thing that can be cleaned. Fields:
#
#   id           unique name, used to remember choices
#   name         shown in the list
#   category     browsers | apps | developer | system | trash-history
#   description  one sentence, shown under the name
#   icon         symbolic icon name (optional)
#   default      checked when first shown (only for things that are safe to lose)
#   running      process names; while one runs, the cleaner is skipped
#   paths        what to delete; matching files and folders are removed
#   kind         paths (default) | package-cache | journal | snap-revisions
#   needs_root   true if only the administrator can delete these
#   exclude_known  skip folders that another cleaner already handles
#
# Path placeholders: {home} {cache} {config} {data} {state}, following the
# XDG base directory variables. `*` matches any part of one name (including
# names starting with a dot); `?` matches one character. Folders themselves
# such as ~/.cache are never deleted, only what's inside.

# ── Browsers ────────────────────────────────────────────────────────────────

[[cleaner]]
id = "firefox-cache"
name = "Firefox"
category = "browsers"
description = "Cached web pages and images. Passwords, cookies and history are kept."
icon = "web-browser-symbolic"
default = true
running = ["firefox", "firefox-bin"]
paths = [
    "{cache}/mozilla/firefox/*/cache2",
    "{cache}/mozilla/firefox/*/startupCache",
    "{cache}/mozilla/firefox/*/thumbnails",
]

