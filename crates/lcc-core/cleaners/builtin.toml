icon = "applications-engineering-symbolic"
running = ["cargo", "rustc"]
paths = ["{home}/.cargo/registry/cache/*", "{home}/.cargo/registry/src/*"]

[[cleaner]]
id = "npm-cache"
name = "Node.js (npm)"
category = "developer"
description = "Downloaded packages. They're downloaded again when a project needs them."
icon = "applications-engineering-symbolic"
running = ["npm"]
paths = ["{home}/.npm/_cacache"]

[[cleaner]]
id = "yarn-cache"
name = "Yarn"
category = "developer"
description = "Downloaded packages. They're downloaded again when a project needs them."
icon = "applications-engineering-symbolic"
running = ["yarn"]
paths = ["{cache}/yarn/*"]

[[cleaner]]
id = "bun-cache"
name = "Bun"
category = "developer"
description = "Downloaded packages. They're downloaded again when a project needs them."
icon = "applications-engineering-symbolic"
running = ["bun"]
paths = ["{home}/.bun/install/cache/*"]

[[cleaner]]
id = "pip-cache"
name = "Python (pip)"
category = "developer"
description = "Downloaded packages. They're downloaded again when needed."
icon = "applications-engineering-symbolic"
running = ["pip", "pip3"]
paths = ["{cache}/pip/*"]

[[cleaner]]
id = "uv-cache"
name = "Python (uv)"
category = "developer"
description = "Downloaded packages. They're downloaded again when needed."
icon = "applications-engineering-symbolic"
running = ["uv"]
paths = ["{cache}/uv/*"]

[[cleaner]]
id = "go-cache"
name = "Go"
category = "developer"
description = "Build cache. Projects take longer to build the first time afterwards."
icon = "applications-engineering-symbolic"
