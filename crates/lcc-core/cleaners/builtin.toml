[[cleaner]]
id = "aur-build-files"
name = "AUR build files"
category = "developer"
description = "Source code and packages left after installing from the AUR with paru or yay."
icon = "package-x-generic-symbolic"
default = true
running = ["paru", "yay", "makepkg"]
paths = ["{cache}/paru/clone/*", "{cache}/yay/*"]

# ── System ──────────────────────────────────────────────────────────────────

[[cleaner]]
id = "shader-caches"
name = "Graphics shader caches"
category = "system"
description = "Compiled graphics code. Games may stutter briefly while it's rebuilt."
icon = "video-display-symbolic"
paths = [
    "{cache}/mesa_shader_cache/*",
    "{cache}/mesa_shader_cache_db/*",
    "{cache}/nvidia/GLCache/*",
    "{cache}/radv_builtin_shaders*",
    "{cache}/qtshadercache*",
]

[[cleaner]]
id = "package-cache"
name = "Old package versions"
category = "system"
description = "Installers of past updates kept by the package manager."
icon = "package-x-generic-symbolic"
default = true
kind = "package-cache"
needs_root = true

[[cleaner]]
id = "snap-revisions"
name = "Old Snap versions"
category = "system"
description = "Older versions of snap apps kept after updates."
icon = "package-x-generic-symbolic"
default = true
kind = "snap-revisions"
needs_root = true

[[cleaner]]
id = "journal"
name = "System logs"
category = "system"
description = "Logs from the system and apps (systemd journal)."
icon = "text-x-generic-symbolic"
kind = "journal"
needs_root = true

[[cleaner]]
id = "coredumps"
name = "Crash reports"
category = "system"
description = "Memory snapshots saved when programs crashed."
icon = "dialog-warning-symbolic"
needs_root = true
paths = ["/var/lib/systemd/coredump/*", "/var/crash/*"]

[[cleaner]]
id = "old-logs"
name = "Old log files"
category = "system"
description = "Rotated and compressed logs in /var/log."
icon = "text-x-generic-symbolic"
needs_root = true
paths = ["/var/log/*.old", "/var/log/*.[0-9]", "/var/log/*.gz", "/var/log/*/*.gz"]

# ── Trash & history ─────────────────────────────────────────────────────────

[[cleaner]]
id = "trash"
name = "Empty the Trash"
category = "trash-history"
description = "Files you deleted. They can't be restored afterwards."
icon = "user-trash-symbolic"
paths = [
    "{data}/Trash/files/*",
    "{data}/Trash/info/*",
    "{data}/Trash/expunged/*",
]

[[cleaner]]
id = "recent-files"
name = "Recently used files list"
category = "trash-history"
description = "The list of files you opened recently, shown in file pickers and apps."
icon = "document-open-recent-symbolic"
paths = ["{data}/recently-used.xbel"]
